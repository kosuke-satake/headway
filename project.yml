name: Headway
options:
  bundleIdPrefix: dev.kosuke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Headway:
    path: .
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  Headway:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Headway
        product: HeadwayCore
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Headway
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Headway shows where you are on the map and finds nearby stops.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.headway
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
