name: Headway
options:
  bundleIdPrefix: dev.kosuke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Headway:
    path: .
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  Headway:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/glyphs
      # Label glyphs keep their folder layout inside the bundle: glyphs/<font>/<range>.pbf.
      - path: App/Resources/glyphs
        type: folder
        buildPhase: resources
      # Offline basemap, fetched by tools/fetch_basemap.sh (not committed).
      - path: data/maps/madison.pmtiles
        buildPhase: resources
    dependencies:
      - package: Headway
        product: HeadwayCore
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Headway
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Headway shows where you are on the map and finds nearby stops.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.headway
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
